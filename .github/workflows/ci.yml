name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (downloads headless Chromium for Puppeteer)
        run: npm install

      - name: Syntax check
        run: npm run test:syntax

      - name: Logic smoke test
        run: npm run test:smoke

      - name: Headless render test
        run: npm run test:render
